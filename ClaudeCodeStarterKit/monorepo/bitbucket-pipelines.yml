# Template for a monorepo root (copy to <git root>/bitbucket-pipelines.yml). One step per
# project, each run only when files under that project change. The kit's own
# bitbucket-pipelines.yml is the standalone-repo version.
image: mcr.microsoft.com/dotnet/sdk:9.0

definitions:
  scripts:
    - &install-pwsh |
      apt-get update && apt-get install -y --no-install-recommends wget apt-transport-https
      wget -q https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb && dpkg -i packages-microsoft-prod.deb
      apt-get update && apt-get install -y powershell

pipelines:
  default:
    - step:
        name: verify ClaudeCodeStarterKit
        condition:
          changesets:
            includePaths:
              - "ClaudeCodeStarterKit/**"
        caches:
          - dotnetcore
        script:
          - export CI=true
          - *install-pwsh
          - pwsh -NoProfile -File ClaudeCodeStarterKit/scripts/verify.ps1
    # Copy the step above for every project that has a scripts/verify.ps1, e.g.:
    # - step:
    #     name: verify FlatCheck
    #     condition: { changesets: { includePaths: ["FlatCheck/**"] } }
    #     ...
    #     script: [export CI=true, *install-pwsh, pwsh -NoProfile -File FlatCheck/scripts/verify.ps1]
